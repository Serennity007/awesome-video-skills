name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  lint-markdown:
    name: Lint Markdown (advisory)
    runs-on: ubuntu-latest
    # Markdown style findings are advisory: they are reported in the job log but
    # must not block CI. Remove `continue-on-error` once the existing findings
    # are cleaned up, so that this becomes a hard gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint all Markdown files
        run: markdownlint '**/*.md' --ignore node_modules --config .markdownlint.json

  validate-skills:
    name: Validate Skill Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check skill files exist
        run: |
          echo "Checking skill files..."
          SKILL_COUNT=$(find skills -name "*.md" | wc -l)
          echo "Found $SKILL_COUNT skill files"
          if [ "$SKILL_COUNT" -lt 10 ]; then
            echo "ERROR: Expected at least 10 skill files, found $SKILL_COUNT"
            exit 1
          fi

      - name: Check minimum line count
        run: |
          echo "Checking minimum line counts (100 lines)..."
          FAILED=0
          for f in skills/**/*.md; do
            LINES=$(wc -l < "$f")
            if [ "$LINES" -lt 100 ]; then
              echo "FAIL: $f has only $LINES lines (minimum: 100)"
              FAILED=1
            else
              echo "PASS: $f ($LINES lines)"
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

      - name: Check required sections
        run: |
          echo "Checking required sections in skill files..."
          FAILED=0
          REQUIRED_SECTIONS=("When to Use" "Instructions for AI Assistant" "Templates" "Common Patterns" "Pitfalls to Avoid")
          for f in skills/**/*.md; do
            for section in "${REQUIRED_SECTIONS[@]}"; do
              if ! grep -qi "## $section" "$f"; then
                echo "FAIL: $f missing section: $section"
                FAILED=1
              fi
            done
          done
          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
          echo "All skill files have required sections."

  check-links:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # A broken link fails the job (no more `|| true` swallowing failures).
          fail: true
          jobSummary: true
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 2
            --exclude 'localhost'
            --exclude '127\.0\.0\.1'
            --exclude 'example\.(com|org|net)'
            './**/*.md'
